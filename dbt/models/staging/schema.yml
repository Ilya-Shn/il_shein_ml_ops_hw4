version: 2
models:
- name: stg_transactions
  description: Нормализация строк и типов, сегмент суммы и ключ клиента. Неизвестные
    метки сохраняются.
  columns:
  - name: transaction_id
    description: Идентификатор исходной строки.
    data_tests:
    - not_null
    - unique
  - name: transaction_time
    description: Время транзакции в UTC.
    data_tests:
    - not_null
  - name: transaction_date
    description: Дата в UTC.
    data_tests:
    - not_null
  - name: transaction_hour
    description: Час в UTC.
    data_tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 0
          max_value: 23
  - name: day_of_week
    description: 'ISO день недели: понедельник 1, воскресенье 7.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          quote: false
  - name: merchant
    description: Мерчант без пробелов по краям.
    data_tests:
    - not_null
  - name: category
    description: Категория в нижнем регистре.
    data_tests:
    - not_null
  - name: amount
    description: Сумма Decimal(18,2).
    data_tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 0
  - name: amount_bucket
    description: SMALL <100; MEDIUM от 100 до 1000; LARGE >=1000.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - SMALL
          - MEDIUM
          - LARGE
          quote: true
  - name: customer_id
    description: Ключ по имени, фамилии, улице и индексу; исходного ID нет.
    data_tests:
    - not_null
  - name: state
    description: Код штата, включая DC.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('states')
          field: state
  - name: is_fraud
    description: 0/1; NULL означает неизвестную метку.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 0
          - 1
          quote: false
